
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GROK BOT PERFORMANCE</title>
<style>
body{background:#080b12;color:#e8edf5;font-family:Arial;padding:16px}
h1{color:#35e6a0}
.card{background:#121a27;border:1px solid #263449;border-radius:12px;padding:16px;margin:12px 0}
.value{font-size:27px;font-weight:bold;margin-top:8px}
.green{color:#35e6a0}.red{color:#ff6875}
.small{color:#91a2b8;font-size:13px}
.item{padding:12px 0;border-bottom:1px solid #263449;font-size:13px}
button{background:#16bd7b;color:#06130d;border:0;padding:12px 18px;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<h1>GROK BOT PERFORMANCE</h1>
<p class="small">Statistik PAPER TRADING dari engine.html</p>

<div class="card">TOTAL TRADES<div class="value" id="total">0</div></div>
<div class="card">WIN RATE<div class="value green" id="winrate">0%</div></div>
<div class="card">TOTAL PROFIT / LOSS<div class="value" id="pnl">$0.00</div></div>
<div class="card">WIN / LOSS<div class="value" id="wl">0 / 0</div></div>
<div class="card">OPEN POSITIONS<div class="value" id="open">0</div></div>

<div class="card">
<b>RIWAYAT TRANSAKSI</b>
<div id="history">Belum ada transaksi.</div>
</div>

<button onclick="loadStats()">REFRESH DATA</button>

<script>
function money(n){
 return "$"+Number(n||0).toFixed(2);
}
function safe(s){
 return String(s||"UNKNOWN").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function loadStats(){
 let trades=[];
 let state={};
 try{
  trades=JSON.parse(localStorage.getItem("grokTrades")||"[]");
  state=JSON.parse(localStorage.getItem("grokEngineState")||"{}");
 }catch(e){}

 const sells=trades.filter(t=>t.type==="SELL");
 const wins=sells.filter(t=>Number(t.pnl)>0);
 const losses=sells.filter(t=>Number(t.pnl)<=0);
 const pnl=sells.reduce((sum,t)=>sum+Number(t.pnl||0),0);
 const rate=sells.length?(wins.length/sells.length*100):0;

 document.getElementById("total").textContent=sells.length;
 document.getElementById("winrate").textContent=rate.toFixed(1)+"%";
 document.getElementById("pnl").textContent=money(pnl);
 document.getElementById("pnl").className="value "+(pnl>=0?"green":"red");
 document.getElementById("wl").textContent=wins.length+" / "+losses.length;
 document.getElementById("open").textContent=(state.positions||[]).length;

 const h=document.getElementById("history");
 h.innerHTML=trades.length?trades.slice().reverse().map(t=>
 `<div class="item"><b class="${t.type==="SELL"?(t.pnl>0?"green":"red"):""}">${safe(t.type)} — ${safe(t.symbol)}</b><br>
 ${safe(t.reason)}<br>
 Harga: ${safe(t.price)}<br>
 ${t.type==="SELL"?"P/L: "+money(t.pnl):""}<br>
 <span class="small">${safe(t.time)}</span></div>`
 ).join(""):"Belum ada transaksi.";
}
loadStats();
</script>
</body>
</html>
