
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GROK BOT TRACKER</title>
<style>
body{background:#080b12;color:#e8edf7;font-family:Arial;padding:18px}
h2{color:#00e5a0}
.card{background:#131a27;border:1px solid #263247;border-radius:12px;padding:15px;margin:12px 0}
input,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border:0;border-radius:8px}
input{background:#202b3c;color:white}
button{background:#00c98b;color:#06120e;font-weight:bold}
.good{color:#00e5a0}.bad{color:#ff6374}
</style>
</head>
<body>
<h2>GROK BOT — TRACKER v2.3</h2>
<p>Virtual Trade Position Tracker</p>

<div class="card">
<h3>Tambah Posisi</h3>
<input id="token" placeholder="Nama token">
<input id="entry" type="number" step="any" placeholder="Harga masuk USD">
<input id="price" type="number" step="any" placeholder="Harga sekarang USD">
<input id="amount" type="number" value="2" placeholder="Modal virtual USD">
<button onclick="add()">TAMBAH POSISI</button>
</div>

<div class="card">
<h3>Statistik</h3>
<p>Posisi aktif: <b id="active">0</b></p>
<p>Sudah ditutup: <b id="closed">0</b></p>
<p>Total PnL: <b id="pnl">$0.00</b></p>
</div>

<div class="card">
<h3>Posisi Aktif</h3>
<div id="positions">Belum ada posisi.</div>
</div>

<div class="card">
<h3>Riwayat Penjualan</h3>
<div id="history">Belum ada riwayat.</div>
</div>

<script>
const KEY='grokTrackerData';
let data={active:[],closed:[]};

function load(){
 try{
  const saved=JSON.parse(localStorage.getItem(KEY)||'null');
  if(saved)data=saved;
 }catch(e){}
}
function save(){
 localStorage.setItem(KEY,JSON.stringify(data));
 render();
}
function add(){
 const token=document.getElementById('token').value.trim();
 const entry=Number(document.getElementById('entry').value);
 const price=Number(document.getElementById('price').value);
 const amount=Number(document.getElementById('amount').value);
 if(!token||entry<=0||price<=0||amount<=0){
  alert('Isi semua data dengan benar');return;
 }
 data.active.push({token,entry,price,amount});
 save();
 document.getElementById('token').value='';
 document.getElementById('entry').value='';
 document.getElementById('price').value='';
}
function update(i){
 const v=Number(document.getElementById('p'+i).value);
 if(v<=0){alert('Harga tidak valid');return;}
 data.active[i].price=v;
 save();
}
function sell(i,reason){
 const p=data.active[i];
 const pnl=(p.price-p.entry)/p.entry*100;
 data.closed.unshift({
  token:p.token,
  pnl:p.amount*pnl/100,
  reason,
  time:new Date().toLocaleString('id-ID')
 });
 data.active.splice(i,1);
 save();
}
function render(){
 let total=0;
 const a=document.getElementById('positions');
 a.innerHTML='';
 if(!data.active.length)a.textContent='Belum ada posisi.';
 data.active.forEach((p,i)=>{
  const pnl=(p.price-p.entry)/p.entry*100;
  const d=document.createElement('div');
  d.className='card';
  const title=document.createElement('b');
  title.textContent=p.token;
  const info=document.createElement('p');
  info.textContent='Entry: $'+p.entry+' | Harga: $'+p.price+' | PnL: '+pnl.toFixed(2)+'%';
  const inp=document.createElement('input');
  inp.type='number';inp.step='any';inp.id='p'+i;
  inp.placeholder='Masukkan harga terbaru';
  const updateBtn=document.createElement('button');
  updateBtn.textContent='UPDATE HARGA';
  updateBtn.onclick=()=>update(i);
  const sellBtn=document.createElement('button');
  sellBtn.textContent='TUTUP POSISI SIMULASI';
  sellBtn.onclick=()=>sell(i,'Manual');
  d.append(title,info,inp,updateBtn,sellBtn);
  a.append(d);
 });
 const h=document.getElementById('history');
 h.innerHTML='';
 if(!data.closed.length)h.textContent='Belum ada riwayat.';
 data.closed.forEach(p=>{
  total+=p.pnl;
  const d=document.createElement('div');
  d.className='card';
  d.textContent=p.time+' | '+p.token+' | '+(p.pnl>=0?'+':'')+'$'+p.pnl.toFixed(2)+' | '+p.reason;
  h.append(d);
 });
 document.getElementById('active').textContent=data.active.length;
 document.getElementById('closed').textContent=data.closed.length;
 document.getElementById('pnl').textContent=(total<0?'-$':'$')+Math.abs(total).toFixed(2);
}
load();
render();
</script>
</body>
</html>
