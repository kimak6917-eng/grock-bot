
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GROK BOT - COPY</title>
<style>
body{background:#080b12;color:white;font-family:Arial;padding:18px}
h1{color:#00e5a0}
input{box-sizing:border-box;width:100%;padding:13px;background:#151c29;color:white;border:1px solid #34445a;border-radius:9px;margin:10px 0}
button{padding:13px;background:#00b987;color:#00150f;border:0;border-radius:9px;font-weight:bold;width:100%}
.status{color:#ffc857;margin:15px 0}
.card{background:#151c29;border:1px solid #263448;border-radius:12px;padding:13px;margin:12px 0}
small{color:#9ca9bd;overflow-wrap:anywhere}
a{color:#00e5a0}
</style>
</head>
<body>
<h1>GROK BOT</h1>
<h3>COPY WALLET MONITOR 0.6</h3>

<p>Masukkan alamat publik wallet Solana:</p>
<input id="wallet" placeholder="Tempel alamat wallet Solana">
<button onclick="startMonitor()">MULAI MONITOR</button>

<div class="status" id="status">Menunggu alamat wallet...</div>
<div id="feed"></div>

<script>
let timer=null;
let lastSignature="";
const statusBox=document.getElementById("status");
const feed=document.getElementById("feed");

async function checkWallet(address){
 try{
  const response=await fetch("https://api.mainnet-beta.solana.com",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    jsonrpc:"2.0",
    id:1,
    method:"getSignaturesForAddress",
    params:[address,{limit:10}]
   })
  });

  if(!response.ok)throw Error("RPC tidak merespons");

  const result=await response.json();
  if(result.error)throw Error(result.error.message);

  const items=result.result||[];
  statusBox.textContent="TERHUBUNG - "+items.length+" transaksi ditemukan";

  items.forEach(tx=>{
   if(tx.signature===lastSignature)return;

   const card=document.createElement("div");
   card.className="card";

   const title=document.createElement("b");
   title.textContent=tx.err?"Transaksi gagal":"Aktivitas wallet terdeteksi";

   const date=document.createElement("p");
   date.textContent=tx.blockTime
    ?new Date(tx.blockTime*1000).toLocaleString()
    :"Waktu belum tersedia";

   const link=document.createElement("a");
   link.href="https://solscan.io/tx/"+tx.signature;
   link.target="_blank";
   link.rel="noopener";
   link.textContent="Lihat transaksi di Solscan";

   const signature=document.createElement("small");
   signature.textContent=tx.signature;

   card.append(title,date,link,document.createElement("br"),signature);
   feed.appendChild(card);
  });

  if(items.length)lastSignature=items[0].signature;

  while(feed.children.length>30)feed.lastChild.remove();

 }catch(error){
  statusBox.textContent="Gagal mengambil data: "+error.message;
 }
}

function startMonitor(){
 const address=document.getElementById("wallet").value.trim();

 if(!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(address)){
  statusBox.textContent="Alamat wallet tidak valid";
  return;
 }

 if(timer)clearInterval(timer);
 feed.innerHTML="";
 lastSignature="";

 statusBox.textContent="Mengambil aktivitas wallet...";
 checkWallet(address);
 timer=setInterval(()=>checkWallet(address),20000);
}
</script>
</body>
</html>
