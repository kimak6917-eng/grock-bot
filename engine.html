
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GROK BOT AUTO ENGINE v2.0</title>
<style>
body{background:#080b12;color:#e8edf7;font-family:Arial;padding:16px}
h2{color:#00e5a0}
.card{background:#131a27;border:1px solid #263247;border-radius:12px;padding:15px;margin:12px 0}
input,button{padding:12px;border-radius:8px;border:0;margin:5px 0}
input{background:#202b3c;color:white;width:90%}
button{background:#00c98b;color:#06120e;font-weight:bold}
.stop{background:#ff6374}
small{color:#91a0b7}
.good{color:#00e5a0}.bad{color:#ff6374}
</style>
</head>
<body>
<h2>GROK BOT — AUTO ENGINE v2.0</h2>
<p>PAPER TRADING ONLY</p>

<div class="card">
<h3>ACCOUNT</h3>
<p>Virtual balance: <b id="balance">$50.00</b></p>
<p>Real trading: <b style="color:#ff6374">DISABLED</b></p>
<p>Status: <b id="status">STOPPED</b></p>
<button onclick="start()">START AUTO BOT</button>
<button class="stop" onclick="stop()">STOP BOT</button>
</div>

<div class="card">
<h3>STRATEGY SETTINGS</h3>
<label>Modal per pembelian ($)</label>
<input id="size" type="number" value="2">
<label>Take Profit (%)</label>
<input id="tp" type="number" value="25">
<label>Stop Loss (%)</label>
<input id="sl" type="number" value="15">
<label>Maksimal posisi</label>
<input id="max" type="number" value="3">
</div>

<div class="card">
<h3>LIVE TOKEN FEED</h3>
<div id="feed">Menunggu koneksi...</div>
</div>

<div class="card">
<h3>OPEN POSITIONS</h3>
<div id="positions">Belum ada posisi.</div>
</div>

<div class="card">
<h3>TRANSACTION HISTORY</h3>
<div id="history">Belum ada transaksi.</div>
</div>

<script>
const WS='wss://pumpportal.fun/api/data';
let socket=null;
let running=false;
let balance=50;
let positions={};
let history=[];
let seen=new Set();

function number(id, fallback){
 const n=Number(document.getElementById(id).value);
 return Number.isFinite(n)&&n>0?n:fallback;
}

function log(message){
 const div=document.createElement('div');
 div.className='card';
 div.textContent=new Date().toLocaleTimeString('id-ID')+' — '+message;
 document.getElementById('history').prepend(div);
}

function updateBalance(){
 document.getElementById('balance').textContent='$'+balance.toFixed(2);
}

function start(){
 if(running)return;
 const size=number('size',2);
 if(size>50){alert('Modal pembelian melebihi modal virtual');return;}
 running=true;
 document.getElementById('status').textContent='CONNECTING';
 socket=new WebSocket(WS);

 socket.onopen=()=>{
  document.getElementById('status').textContent='RUNNING — PAPER MODE';
  socket.send(JSON.stringify({method:'subscribeNewToken'}));
  log('Bot aktif. Feed token baru tersambung.');
 };

 socket.onmessage=(event)=>{
  if(!running)return;
  try{
   const data=JSON.parse(event.data);
   if(!data.mint||!data.symbol||!data.marketCapSol)return;
   if(seen.has(data.mint))return;
   seen.add(data.mint);
   if(seen.size>500)seen.clear();

   const price=Number(data.marketCapSol);
   const token={
    mint:data.mint,
    symbol:String(data.symbol).slice(0,20),
    price:price
   };
   showFeed(token);
   autoBuy(token);
  }catch(e){}
 };

 socket.onerror=()=>{
  document.getElementById('status').textContent='CONNECTION ERROR';
 };

 socket.onclose=()=>{
  if(running)document.getElementById('status').textContent='DISCONNECTED';
 };
}

function stop(){
 running=false;
 if(socket){socket.close();socket=null;}
 document.getElementById('status').textContent='STOPPED';
 log('Bot dihentikan.');
}

function showFeed(t){
 const div=document.createElement('div');
 div.className='card';
 div.textContent=t.symbol+' | Market cap SOL: '+t.price;
 document.getElementById('feed').prepend(div);
}

function autoBuy(t){
 const size=number('size',2);
 const max=Math.floor(number('max',3));
 if(Object.keys(positions).length>=max)return;
 if(balance<size)return;
 if(positions[t.mint])return;

 balance-=size;
 positions[t.mint]={
  symbol:t.symbol,
  mint:t.mint,
  entry:t.price,
  current:t.price,
  amount:size
 };
 updateBalance();
 log('SIMULASI BUY '+t.symbol+' sebesar $'+size);
 renderPositions();
}

function autoSell(p){
 const tp=number('tp',25);
 const sl=number('sl',15);
 const pnl=((p.current-p.entry)/p.entry)*100;
 if(pnl>=tp||pnl<=-sl){
  const result=p.amount*(1+pnl/100);
  balance+=result;
  log('SIMULASI SELL '+p.symbol+' | PnL '+pnl.toFixed(2)+'%');
  delete positions[p.mint];
  updateBalance();
  renderPositions();
 }
}

function renderPositions(){
 const box=document.getElementById('positions');
 box.innerHTML='';
 const list=Object.values(positions);
 if(!list.length){box.textContent='Belum ada posisi.';return;}
 list.forEach(p=>{
  const pnl=((p.current-p.entry)/p.entry)*100;
  const div=document.createElement('div');
  div.className='card';
  div.textContent=p.symbol+' | Entry: '+p.entry+
   ' | Current: '+p.current+
   ' | PnL: '+pnl.toFixed(2)+'%';
  box.append(div);
 });
}

</script>
</body>
</html>
