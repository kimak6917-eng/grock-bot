

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GROK BOT AUTO ENGINE v2.1</title>
<style>
body{background:#080b12;color:#e8edf7;font-family:Arial;padding:16px}
h2{color:#00e5a0}
.card{background:#131a27;border:1px solid #263247;border-radius:12px;padding:15px;margin:12px 0;overflow-wrap:anywhere}
input,button{padding:12px;border-radius:8px;border:0;margin:5px 0}
input{background:#202b3c;color:white;width:90%}
button{background:#00c98b;color:#06120e;font-weight:bold}
.stop{background:#ff6374}
small{color:#91a0b7}
</style>
</head>
<body>
<h2>GROK BOT — AUTO ENGINE v2.1</h2>
<p>PAPER TRADING ONLY — NO REAL TRANSACTIONS</p>

<div class="card">
<h3>ACCOUNT</h3>
<p>Virtual balance: <b id="balance">$50.00</b></p>
<p>Status: <b id="status">STOPPED</b></p>
<button onclick="start()">START BOT</button>
<button class="stop" onclick="stop()">STOP BOT</button>
</div>

<div class="card">
<h3>STRATEGY</h3>
<label>Modal per posisi ($)</label>
<input id="size" type="number" value="2">
<label>Take Profit (%)</label>
<input id="tp" type="number" value="25">
<label>Stop Loss (%)</label>
<input id="sl" type="number" value="15">
<label>Maksimal posisi</label>
<input id="max" type="number" value="3">
</div>

<div class="card">
<h3>TOKEN FEED</h3>
<div id="feed">Menunggu koneksi...</div>
</div>

<div class="card">
<h3>OPEN POSITIONS</h3>
<div id="positions">Belum ada posisi.</div>
</div>

<div class="card">
<h3>TRANSACTION HISTORY</h3>
<div id="history">Belum ada transaksi.</div>
</div>

<script>
const WS='wss://pumpportal.fun/api/data';
const PRICE_API='https://api.dexscreener.com/latest/dex/tokens/';
let socket=null;
let running=false;
let balance=50;
let positions={};
let seen=new Set();
let priceTimer=null;

function val(id,def){
 const n=Number(document.getElementById(id).value);
 return Number.isFinite(n)&&n>0?n:def;
}

function log(msg){
 const d=document.createElement('div');
 d.className='card';
 d.textContent=new Date().toLocaleTimeString('id-ID')+' — '+msg;
 document.getElementById('history').prepend(d);
}

function updateBalance(){
 document.getElementById('balance').textContent='$'+balance.toFixed(2);
}

function start(){
 if(running)return;
 running=true;
 document.getElementById('status').textContent='CONNECTING';
 socket=new WebSocket(WS);

 socket.onopen=()=>{
  document.getElementById('status').textContent='RUNNING — PAPER MODE';
  socket.send(JSON.stringify({method:'subscribeNewToken'}));
  log('Feed token baru terhubung.');
 };

 socket.onmessage=event=>{
  if(!running)return;
  try{
   const t=JSON.parse(event.data);
   if(!t.mint||!t.symbol||seen.has(t.mint))return;
   seen.add(t.mint);
   const div=document.createElement('div');
   div.className='card';
   div.textContent=t.symbol+' — token terdeteksi';
   document.getElementById('feed').prepend(div);
   checkPriceAndBuy(t);
  }catch(e){}
 };

 socket.onerror=()=>{
  document.getElementById('status').textContent='CONNECTION ERROR';
 };

 socket.onclose=()=>{
  if(running)document.getElementById('status').textContent='DISCONNECTED';
 };

 priceTimer=setInterval(updatePrices,15000);
}

function stop(){
 running=false;
 if(socket){socket.close();socket=null;}
 if(priceTimer){clearInterval(priceTimer);priceTimer=null;}
 document.getElementById('status').textContent='STOPPED';
 log('Bot dihentikan. Posisi simulasi tetap tersimpan selama halaman terbuka.');
}

async function getPrice(mint){
 const response=await fetch(PRICE_API+encodeURIComponent(mint));
 if(!response.ok)throw new Error('Harga tidak tersedia');
 const data=await response.json();
 const pairs=(data.pairs||[])
  .filter(p=>p.chainId==='solana'&&Number(p.priceUsd)>0)
  .sort((a,b)=>(Number(b.liquidity?.usd)||0)-(Number(a.liquidity?.usd)||0));
 return pairs.length?Number(pairs[0].priceUsd):null;
}

async function checkPriceAndBuy(token){
 if(!running)return;
 const size=val('size',2);
 const max=Math.floor(val('max',3));
 if(Object.keys(positions).length>=max||balance<size)return;

 try{
  const price=await getPrice(token.mint);
  if(!price||!running)return;
  if(positions[token.mint])return;

  balance-=size;
  positions[token.mint]={
   mint:token.mint,
   symbol:String(token.symbol).slice(0,20),
   entry:price,
   current:price,
   amount:size
  };
  updateBalance();
  log('SIMULASI BUY '+token.symbol+' pada harga $'+price);
  render();
 }catch(e){
  log('Harga '+token.symbol+' belum tersedia; tidak dibeli.');
 }
}

async function updatePrices(){
 if(!running)return;
 const list=Object.values(positions);
 for(const p of list){
  try{
   const price=await getPrice(p.mint);
   if(!price||!positions[p.mint])continue;
   p.current=price;
   const pnl=(price-p.entry)/p.entry*100;
   const tp=val('tp',25);
   const sl=val('sl',15);

   if(pnl>=tp||pnl<=-sl){
    const proceeds=p.amount*(1+pnl/100);
    balance+=proceeds;
    log('SIMULASI SELL '+p.symbol+' | PnL '+pnl.toFixed(2)+'%');
    delete positions[p.mint];
    updateBalance();
   }
  }catch(e){}
 }
 render();
}

function render(){
 const box=document.getElementById('positions');
 box.innerHTML='';
 const list=Object.values(positions);
 if(!list.length){box.textContent='Belum ada posisi.';return;}

 list.forEach(p=>{
  const pnl=(p.current-p.entry)/p.entry*100;
  const d=document.createElement('div');
  d.className='card';
  d.textContent=p.symbol+
   ' | Entry: $'+p.entry+
   ' | Harga: $'+p.current+
   ' | PnL: '+pnl.toFixed(2)+'%';
  box.append(d);
 });
}
</script>
</body>
</html>
